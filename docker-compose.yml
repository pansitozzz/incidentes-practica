services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentes_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidentes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      USE_SQLITE: "False"
      POSTGRES_DB: ${POSTGRES_DB:-incidentes_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidentes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-por-una-generada-localmente}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - db

volumes:
  postgres_data:
